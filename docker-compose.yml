version: "3.8"

services:
  mudflow-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mudflow_os_v2_5
    restart: unless-stopped
    ports:
      - "9001:9001"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    volumes:
      # Source volume mount for live code reloading
      - .:/app
      # Explicit volume mount for local SQLite database and PDF persistence
      - ./data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 9001 --reload
